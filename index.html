    }

      border: 1px solid rgba(251, 146, 60, 0.5);

    .level-sidebar h3 {

      margin-bottom: 1.2rem;

      align-items: center;
      justify-content: center;
      gap: 8px;

    .level-sidebar h3 i {

      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .level-btn i {
      font-size: 0.75rem;
      color: #fb923c;
    }

    .level-btn:hover {
      background: linear-gradient(105deg, #2a2f4a, #1a1f38);
      border-color: #f97316;

    }

    .level-btn.active {

      border-color: #fdba74;
      color: white;
    }

    .level-btn.active i {
      color: #fff0e0;
    }

    .hero {

    }

      background: linear-gradient(135deg, #fb923c, #f97316, #fdba74);

      background-clip: text;
      color: transparent;
      letter-spacing: -0.5px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      flex-wrap: nowrap;
      white-space: nowrap;
      justify-content: center;
    }

    .hero h1 i {
      background: none;
      -webkit-text-fill-color: #fb923c;
      font-size: 2rem;
    }

    @media (max-width: 550px) {
      .hero h1 {

      }

    .offer-btn:hover {

      background: linear-gradient(105deg, #1c2340, #12172e);
      border-color: #fb923c;
      box-shadow: 0 8px 18px rgba(0,0,0,0.4);
    }

    .offer-btn.disabled {
      opacity: 0.6;
      cursor: not-allowed;
      pointer-events: none;
      background: linear-gradient(105deg, #1a2a1a, #0f1f0f);
      border-color: #4a6a4a;
      transform: none;

    .btn-left {
      display: flex;
      align-items: center;

    .btn-left i {
      font-size: 1.2rem;
      color: #fb923c;
      min-width: 28px;
      text-align: center;
    }
    .btn-left span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .click-count {
      background: #00000055;
      border-radius: 40px;
      padding: 3px 12px;
      font-size: 0.8rem;
      font-weight: 800;
      color: #fdba74;
      border: 0.5px solid #fb923c;

    .offer-btn.clicked {

      align-items: center;
      gap: 8px;

    .reset-btn:hover {

      color: #ffffff;
      border-color: #fb923c;

      margin-top: 1.5rem;
      text-align: center;
      color: #6b7280;
      font-size: 0.75rem;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    @media (max-width: 850px) {
      .main-container { flex-direction: column; }
      .level-sidebar { display: none; }
      .mobile-tier-bar {
        display: block;
        background: rgba(15, 20, 35, 0.85);
        backdrop-filter: blur(16px);
        border-radius: 1.5rem;
        padding: 1rem;
        margin-bottom: 1.5rem;
        border: 1px solid rgba(251, 146, 60, 0.5);

      .mobile-tier-bar h3 {
        color: #ffd6a5;
        font-size: 1rem;
        text-align: center;
        margin-bottom: 0.8rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .mobile-triggers {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
      }
      .mobile-tier-btn {
        background: linear-gradient(105deg, #1a1e32, #11152a);
        border: 1px solid #fb923c;
        border-radius: 60px;
        padding: 6px 0;
        font-weight: 700;
        font-size: 0.65rem;
        color: #ffdead;
        cursor: pointer;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
      }
      .mobile-tier-btn i { font-size: 0.65rem; color: #fb923c; }
      .mobile-tier-btn.active {
        background: linear-gradient(105deg, #ea580c, #c2410c);
        border-color: #fdba74;
        color: white;
      }
      .btn-grid { max-height: 45vh; }
      .stats-card { margin-top: 1.5rem; }
    }
    @media (min-width: 851px) {
      .mobile-tier-bar { display: none; }
    }
  </style>
</head>

<script>
  // ==================== 30 LINKS ====================
  const ALL_LINKS = [

    "https://www.profitableratecpmnetwork.com/bxtaui9sg?key=2b23ad93fd3aa46704e0fe6cc6228b06",
    "https://www.profitableratecpmnetwork.com/z0jkbbyv?key=6d3664e1ae5aa014643a028815b68fc4",
    "https://www.profitableratecpmnetwork.com/e8jm4p6z?key=c4ad33b9b0b7899689f740d9d83d5f0b",
    "https://www.profitableratecpmnetwork.com/sabf7kt2c?key=dfef9f852aac81e153a2283c08c98997",
    "https://www.profitableratecpmnetwork.com/kr7u9x41fw?key=892d75164b5e3ca43412b34df58bb40d",
    "https://www.profitableratecpmnetwork.com/gmjmypij18?key=79ba67d67b7e329ba2895b70c74fd288",
    "https://www.profitableratecpmnetwork.com/j4fgpruf?key=76a8e3be2ac8861972705d193be6bb9b",
    "https://www.profitableratecpmnetwork.com/tzquyvkmb?key=908c313096bd344acbd6be04081cda1a",
    "https://www.profitableratecpmnetwork.com/d864u27b?key=453c2b6b7c78297b1560e4ccdcf05b8c",
    "https://www.profitableratecpmnetwork.com/a6rcs77v?key=8d5a007df19c5ea48c077ddc6c759285",
    "https://www.profitableratecpmnetwork.com/cf0mchwdt?key=264b36fb6d115eeb876358f5add4d690",
    "https://www.profitableratecpmnetwork.com/rr8jehfk6w?key=61df2c9a7e7228249258abc8a38ddba4",
    "https://www.profitableratecpmnetwork.com/ww87f7sy42?key=87139c3b9cfe0445409b9943bdfed119",
    "https://www.profitableratecpmnetwork.com/iyx67f4w?key=3b8291cfd95f27e5c57e4db7a314e45c",
    "https://www.profitableratecpmnetwork.com/u1u14zhgm4?key=48156d643d9a09672487a7c87ebf5271",
    "https://www.profitableratecpmnetwork.com/giw7fd5uj?key=b015f8262ac7bb97f1bc94ded614067a",
    "https://www.profitableratecpmnetwork.com/g03ium559i?key=2a86b854e48eb8aa06a5c183ba4837ce"
  ];

  // ========== USER-FRIENDLY & AD-COMPLIANT OFFER NAMES ==========
  const OFFER_NAMES = [
    "🧭 Kind Navigator Bonus",
    "🐝 Busy Bee Perk",
    "🦋 Butterfly Bonus",
    "🔥 Warm Welcome Pack",
    "🕶️ Quiet Stealth Perk",
    "🎡 Ferris Wheel Token",
    "⚡ Quick Access Pass",
    "🏆 Friendly Milestone",
    "🌌 Starry Night Gift",
    "🎁 Simple Bonus Pack",
    "🧩 Friendly Mystery Tile",
    "🎠 Carousel Bonus Spin",
    "⛰️ Mountain View Reward",
    "🌟 Daily Glow Reward",
    "📱 Light Mobile Bonus",
    "🃏 Gentle Wild Card",
    "🌸 Floral Reward Bundle",
    "🎈 Soft Celebration Pack",
    "🎵 Peaceful Sound Pack",
    "🔑 Gentle Vault Key",
    "🌿 Pure Lucky Clover",
    "🛡️ Cozy Secure Plus",
    "☀️ Summer Surprise Deal",
    "⚙️ Simple Utility Perk",
    "🎨 Kind Creator Kit",
    "🎧 Calm Audio Reward",
    "🎲 Simple Dice Reward",
    "⭐ Pure Bonus Token",
    "📚 Warm Insider Pass",
    "🌊 Calm Wave Voucher"
  ];

  // Matching icons for each offer
  const OFFER_ICONS = [
    "mobile-alt",
    "cookie",
    "seedling",
    "gift",
    "balloon",
    "carrot",
    "lightbulb",
    "bolt",
    "beer",
    "tree",
    "pizza-slice",
    "leaf",
    "hamburger",
    "umbrella",
    "snowflake",
    "dice-d6",
    "rocket",
    "compass",
    "cocktail",
    "apple-alt",
    "wine-glass",
    "bell",
    "star-of-life",
    "cloud",
    "sunglasses",
    "ice-cream",
    "fire",
    "sun",
    "gem",
    "gamepad"
  ];

  // Shuffle array utility (Fisher-Yates) for unique order per user
  function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // Get persistent shuffled order for this user
  function getShuffledIndices() {
    const ORDER_KEY = "vaultShuffledOrderV3";
    const saved = localStorage.getItem(ORDER_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      if (parsed.length === 30) return parsed;
    }
    const indices = Array.from({ length: 30 }, (_, i) => i);
    shuffleArray(indices);
    localStorage.setItem(ORDER_KEY, JSON.stringify(indices));
    return indices;
  }

  const shuffledOrder = getShuffledIndices();

  // Build tier offers using shuffled order (3 per tier)
  const TIER_OFFERS = {};
  for (let tier = 1; tier <= 10; tier++) {
    TIER_OFFERS[tier] = [];
    for (let j = 0; j < 3; j++) {
      const globalIdx = shuffledOrder[(tier - 1) * 3 + j];
      if (globalIdx === undefined) continue;
      TIER_OFFERS[tier].push({
        name: OFFER_NAMES[globalIdx % OFFER_NAMES.length],
        icon: OFFER_ICONS[globalIdx % OFFER_ICONS.length],
        link: ALL_LINKS[globalIdx],
        originalIndex: globalIdx
      });
    }
  }

  const TOTAL_OFFERS = 30;
  let clickCounts = new Array(TOTAL_OFFERS).fill(0);
  let claimedStatus = new Array(TOTAL_OFFERS).fill(false);
  const STORAGE_KEY = "vaultClicksV3";
  const CLAIMED_KEY = "vaultClaimedV3";

  function loadCounts() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      try {
        let arr = JSON.parse(saved);
        if (arr.length === TOTAL_OFFERS) clickCounts = arr;
      } catch(e) {}
    }
    const savedClaimed = localStorage.getItem(CLAIMED_KEY);
    if (savedClaimed) {
      try {
        let arr = JSON.parse(savedClaimed);
        if (arr.length === TOTAL_OFFERS) claimedStatus = arr;
      } catch(e) {}
    }
  }
  function saveCounts() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(clickCounts));
    localStorage.setItem(CLAIMED_KEY, JSON.stringify(claimedStatus));
  }
  function updateTotalDisplay() {
    const total = clickCounts.reduce((a,b)=>a+b,0);
    document.getElementById("totalClicks").innerText = total;
  }

  let currentTier = 1;

  function renderCurrentTier() {
    const grid = document.getElementById("offersGrid");
    grid.innerHTML = "";
    const offers = TIER_OFFERS[currentTier];
    if (!offers) return;
    const tierNames = ["Starter Pack", "Bronze Tier", "Silver Tier", "Gold Tier", "Platinum Tier", "Emerald Tier", "Ruby Tier", "Sapphire Tier", "Diamond Tier", "Ultimate Vault"];
    const levelTitle = document.getElementById("levelName");
    const levelBadge = document.getElementById("levelBadge");
    levelTitle.innerText = `Tier ${currentTier} · ${tierNames[currentTier-1] || "Tier " + currentTier}`;
    levelBadge.innerText = offers.length + " Offers";

    offers.forEach((offer) => {
      const globalIdx = offer.originalIndex;
      const count = clickCounts[globalIdx];
      const isClaimed = claimedStatus[globalIdx];
      const hasClick = count > 0;

      const btn = document.createElement("a");
      if (!isClaimed) {
        btn.href = offer.link;
        btn.target = "_blank";
        btn.rel = "noopener noreferrer";
      } else {
        btn.href = "javascript:void(0);";
      }
      btn.className = `offer-btn ${hasClick ? "clicked" : ""} ${isClaimed ? "disabled" : ""}`;
      btn.setAttribute("data-global", globalIdx);

      btn.innerHTML = `<div class="btn-left"><i class="fas fa-${offer.icon}"></i><span>${offer.name}</span></div><div class="click-count">${count}</div>`;

      if (!isClaimed) {
        btn.addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
          if (claimedStatus[globalIdx]) return false;

          claimedStatus[globalIdx] = true;
          clickCounts[globalIdx] += 1;
          saveCounts();
          updateTotalDisplay();
          renderCurrentTier();

          window.open(offer.link, "_blank");
          return false;
        });
      } else {
        btn.style.cursor = "not-allowed";
        btn.onclick = (e) => { e.preventDefault(); return false; };
      }

      grid.appendChild(btn);
    });
  }

  function setActiveTier(tier) {
    currentTier = tier;
    document.querySelectorAll(".level-btn").forEach(btn => {
      if (parseInt(btn.getAttribute("data-level")) === tier) btn.classList.add("active");
      else btn.classList.remove("active");
    });
    document.querySelectorAll(".mobile-tier-btn").forEach(btn => {
      if (parseInt(btn.getAttribute("data-level")) === tier) btn.classList.add("active");
      else btn.classList.remove("active");
    });
    renderCurrentTier();
  }

  function resetCounters() {
    for (let i = 0; i < TOTAL_OFFERS; i++) {
      clickCounts[i] = 0;
      claimedStatus[i] = false;
    }
    saveCounts();
    updateTotalDisplay();
    renderCurrentTier();
  }

  function buildTriggers() {
    const desktopContainer = document.getElementById("desktopTriggers");
    const mobileContainer = document.getElementById("mobileTriggers");
    desktopContainer.innerHTML = "";
    mobileContainer.innerHTML = "";
    for (let i = 1; i <= 10; i++) {
      const dBtn = document.createElement("div");
      dBtn.className = "level-btn";
      dBtn.setAttribute("data-level", i);
      dBtn.innerHTML = `<i class="fas fa-tag"></i> ${i}`;
      dBtn.addEventListener("click", () => setActiveTier(i));
      desktopContainer.appendChild(dBtn);
      const mBtn = document.createElement("div");
      mBtn.className = "mobile-tier-btn";
      mBtn.setAttribute("data-level", i);
      mBtn.innerHTML = `<i class="fas fa-tag"></i> ${i}`;
      mBtn.addEventListener("click", () => setActiveTier(i));
      mobileContainer.appendChild(mBtn);
    }
  }

  document.getElementById("resetAllBtn").addEventListener("click", resetCounters);
  loadCounts();
  buildTriggers();
  setActiveTier(1);
  updateTotalDisplay();
</script>
</body>
</html>
